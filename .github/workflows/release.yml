name: Release Packs

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: packs-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install -r tools/requirements.txt
      - name: Validate source and tag provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m unittest discover -s tests -v
          git merge-base --is-ancestor HEAD origin/main
          python -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_TAG"])'
      - name: Generate and validate immutable release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          python tools/generate_registry.py --repo "$RELEASE_REPO" --tag "$RELEASE_TAG" --out registry.json
          python tools/validate_packs.py
      - name: Stage and publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Pack Release $RELEASE_TAG" --generate-notes registry.json suite-compatibility.json packs/*.json
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Update discovery registry after asset publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update registry for published pack release"
            git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push "https://github.com/$RELEASE_REPO.git" HEAD:main
          fi
